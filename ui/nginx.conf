server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The job list polls every 700 ms and a refine job can run for minutes, so the
    # proxy must not time out before the job does.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # A single-page app: the selected job lives in the URL fragment, but a deep
    # link to any path still has to land on index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
